<!-- OSE_spells.html --> 

<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PFMKRV8VBN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PFMKRV8VBN');
  </script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3x5 Arcana - OSE Spells</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div id="menu-container"></div>
    <h1 class="main-title">3x5 Arcana: OSE Spells</h1>
    
    <!-- Search Bar -->
    <input type="text" id="search-bar" placeholder="Search Spells...">
    
    <!-- Radio Buttons -->
    <div id="sort-group" class="sort-group">
      <label class="sort-option">
        <input type="radio" name="sort-mode" value="level" checked>
        <span class="dot"></span>
        <span class="label-text">Level</span>
      </label>
      <label class="sort-option">
        <input type="radio" name="sort-mode" value="alpha">
        <span class="dot"></span>
        <span class="label-text">A–Z</span>
      </label>
    </div>
    
    <!-- Filter Container -->
    <div id="spell-filter-container">
      <div class="spell-range-container">
        <label class="slider-label" for="slider-min">Level:</label>
        <span id="spell-range-display">1 - 6</span>
        <div class="slider-inputs">
          <input type="range" id="slider-min" value="1" step="1" min="1" max="6">
          <input type="range" id="slider-max" value="6" step="1" min="1" max="6">
        </div>
      </div>
    </div>
    
    <!-- Class Filters -->
    <div class="filter-group">
      <label><input type="checkbox" id="filter-magic-user" checked> Magic-User</label>
      <label><input type="checkbox" id="filter-cleric" checked> Cleric</label>
    </div>
  </header>
  
  <!-- Spacer for Proper Header Positioning -->
  <div class="spacer"></div>
  
  <!-- Favorites List -->
  <div id="favorites-list"></div>
  <div class="spacer"></div>
  
  <!-- Cards List -->
  <div id="cards-list"></div>
 
  <!-- License Card -->
  <div id="license-container"></div>
 
  <div class="spacer"></div>
  
  <!-- Logo Image -->
  <img src="/designed_for_use_with_OSE_white.png" 
       alt="Old-School Essentials Logo" 
       class="share-icon">
  <div class="spacer"></div>
  
  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="card_print.js"></script>
  <script src="/burgermenu_script.js"></script>
  <script src="/list_script.js"></script>
  <script src="/OSE_spells_script.js"></script>
  <script src="/script.js"></script>
</body>
</html>
